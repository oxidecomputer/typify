[package]
name = "typify"
version = "0.10.1"
edition = "2024"
license = "Apache-2.0"
description = "JSON schema to rust type code generator"
repository = "https://github.com/oxidecomputer/typify"
readme = "../README.md"
keywords = ["json", "schema", "proc_macro"]
categories = ["api-bindings", "compilers"]
rust-version.workspace = true

[features]
default = ["macro", "chrono"]
macro = ["typify-macro"]
# Selects the date library that `date` and `date-time` strings map to. jiff
# takes precedence when both are enabled.
chrono = ["typify-impl/chrono", "typify-macro?/chrono"]
jiff = ["typify-impl/jiff", "typify-macro?/jiff"]

[dependencies]
typify-macro = { workspace = true, optional = true }
typify-impl = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
env_logger = { workspace = true }
jiff = { workspace = true }
expectorate = { workspace = true }
glob = { workspace = true }
quote = { workspace = true }
regress = { workspace = true }
rustfmt-wrapper = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
trybuild = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
