[package]
name = "typify"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
description = "JSON schema to rust type code generator"
repository = "https://github.com/oxidecomputer/typify"
readme = "../README.md"
keywords = ["json", "schema", "proc_macro"]
categories = ["api-bindings", "compilers"]

[features]
default = ["macro"]
macro = [
	"dep:chrono",
	"dep:regress",
	"dep:serde",
	"dep:serde_json",
	"dep:typify-macro",
	"dep:uuid",
]

[dependencies]
chrono = { workspace = true, optional = true }
regress = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
typify-macro = { workspace = true, optional = true }
typify-impl = { workspace = true }
uuid = { workspace = true, features = ["serde"], optional = true }

[dev-dependencies]
chrono = { workspace = true }
env_logger = { workspace = true }
expectorate = { workspace = true }
glob = { workspace = true }
quote = { workspace = true }
regress = { workspace = true }
rustfmt-wrapper = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
trybuild = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
